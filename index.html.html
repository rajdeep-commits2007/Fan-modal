<style>
:root{--bg:#f2f0eb;--card:rgba(255,255,255,.75);--border:rgba(28,25,23,.1);--text:#1c1917;--muted:#6b655b;--accent:#b45309;--accent2:var(--accent);--on-accent:#fff;--shadow:0 20px 50px -20px rgba(40,30,10,.2);--blob1:rgba(180,83,9,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0d;--card:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);--text:#f3f0ea;--muted:#9b968c;--accent:#f59e0b;--accent2:var(--accent);--on-accent:#1a1206;--shadow:0 20px 60px -20px rgba(0,0,0,.7);--blob1:rgba(245,158,11,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0d;--card:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);--text:#f3f0ea;--muted:#9b968c;--accent:#f59e0b;--accent2:var(--accent);--on-accent:#1a1206;--shadow:0 20px 60px -20px rgba(0,0,0,.7);--blob1:rgba(245,158,11,.1);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);transition:background .4s,color .4s;overflow-x:hidden}
body::before{content:none}

.switch.on .knob{transform:translateX(56px);color:var(--accent2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:5px;outline:none;cursor:pointer;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p) 100% no-repeat,rgba(120,130,160,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:8px;background:#fff;border:4px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:6px;background:#fff;border:4px solid var(--accent)}
.preset{border-radius:18px;padding:12px 8px;border:1px solid var(--border);background:rgba(120,130,160,.1);cursor:pointer;transition:all .25s;text-align:center;color:var(--text)}
.preset:hover{transform:translateY(-2px)}

@keyframes tin{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:none}}
@keyframes tout{from{opacity:1;transform:none}to{opacity:0;transform:translateX(40%) scale(.96)}}
.toast{animation:tin .45s cubic-bezier(.22,1,.36,1) both}
.toast.leave{animation:tout .4s ease-in both}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.dot.run{animation:pulse 1.4s infinite}

.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/plain" id="app-src">
const { useState, useEffect, useRef } = React;

type Theme = "dark" | "light";
type Kind = "on" | "off" | "speed" | "reset";
type ToastItem = { id: number; key: string; msg: string; kind: Kind };

const KEY = "aerosmart:v1";
const DEFAULTS = { on: false, speed: 50, theme: "dark" as Theme, total: 0, energy: 0 };
const LEVELS = [
  { n: 1, label: "Low", v: 25 },
  { n: 2, label: "Medium", v: 50 },
  { n: 3, label: "High", v: 75 },
  { n: 4, label: "Turbo", v: 100 },
];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return { ...DEFAULTS, ...JSON.parse(raw) };
  } catch (e) {}
  const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  return { ...DEFAULTS, theme: (prefersLight ? "light" : "dark") as Theme };
}

const fmt = (s: number) => {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return [h, m, x].map((n) => String(n).padStart(2, "0")).join(":");
};
const watts = (on: boolean, speed: number) => (on ? 6 + 54 * Math.pow(speed / 100, 2.2) : 0);

const P: Record<string, any> = {
  power: [<path d="M12 2v10" />, <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />],
  sun: [<circle cx="12" cy="12" r="4" />, <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />],
  moon: [<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />],
  zap: [<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l-1.92 6.02A1 1 0 0 0 11 14z" />],
  clock: [<circle cx="12" cy="12" r="10" />, <path d="M12 6v6l4 2" />],
  reset: [<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />, <path d="M3 3v5h5" />],
  gauge: [<path d="m12 14 4-4" />, <path d="M3.34 19a10 10 0 1 1 17.32 0" />],
  wind: [<path d="M12.8 19.6A2 2 0 1 0 14 16H2" />, <path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" />, <path d="M9.8 4.4A2 2 0 1 1 11 8H2" />],
  battery: [<rect x="2" y="7" width="16" height="10" rx="2" />, <path d="M22 11v2M6 11v2M10 11v2" />],
  check: [<circle cx="12" cy="12" r="10" />, <path d="m9 12 2 2 4-4" />],
  instagram: [<rect x="2" y="2" width="20" height="20" rx="5" ry="5" />, <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />, <path d="M17.5 6.5h.01" />],
  linkedin: [<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />, <rect x="2" y="9" width="4" height="12" />, <circle cx="4" cy="4" r="2" />],
  github: [<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />, <path d="M9 18c-4.51 2-5-2-7-2" />],
};
const SOCIALS = [
  { n: "instagram", label: "Instagram", href: "https://www.instagram.com/boi_rajdeep/" },
  { n: "linkedin", label: "LinkedIn", href: "https://www.linkedin.com/in/rajdeep-maji-5ba27042b/" },
  { n: "github", label: "GitHub", href: "https://github.com/rajdeep-commits2007" },
];
const Icon = ({ n, s = 20 }: { n: string; s?: number }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    {P[n].map((e: any, i: number) => React.cloneElement(e, { key: i }))}
  </svg>
);

function Fan3D({ on, speed }: { on: boolean; speed: number }) {
  const mount = useRef<HTMLDivElement>(null);
  const st = useRef({ on, speed });
  st.current = { on, speed };

  useEffect(() => {
    const el = mount.current!;
    const T = (window as any).THREE;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T.sRGBEncoding;
    el.appendChild(renderer.domElement);
    renderer.domElement.style.display = "block";
    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(32, 1, 0.1, 100);
    scene.add(new T.HemisphereLight(0xffffff, 0x334155, 0.9));
    const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(4, 6, 8); scene.add(key);
    const cyan = new T.PointLight(0xffc27a, 1.2, 40); cyan.position.set(-6, 2, 4); scene.add(cyan);
    const rim = new T.PointLight(0xc9d3e0, 0.8, 40); rim.position.set(5, -2, -4); scene.add(rim);

    const M = (c: number, m: number, r: number, o: any = {}) => new T.MeshStandardMaterial({ color: c, metalness: m, roughness: r, ...o });
    const pearl = M(0xe8ecf3, 0.35, 0.3), alu = M(0xaeb8c6, 0.9, 0.25), dark = M(0x1e2633, 0.6, 0.35);
    const bladeMat = M(0x2b3447, 0.5, 0.28, { transparent: true, opacity: 0.92 });
    const ledMat = M(0x475569, 0, 0.5, { emissive: 0x000000 });

    const fan = new T.Group(); fan.position.y = 0.6; scene.add(fan);
    const head = new T.Group(); fan.add(head);
    const add = (g: any, m: any, p: number[], r?: number[], s?: number[], parent: any = head) => {
      const o = new T.Mesh(g, m); o.position.set(p[0], p[1], p[2]);
      if (r) o.rotation.set(r[0], r[1], r[2]); if (s) o.scale.set(s[0], s[1], s[2]); parent.add(o); return o;
    };
    add(new T.CylinderGeometry(0.55, 0.7, 0.9, 48), pearl, [0, 0, -0.45], [Math.PI / 2, 0, 0]);
    add(new T.SphereGeometry(0.7, 48, 32), pearl, [0, 0, -0.9], undefined, [1, 1, 0.55]);
    add(new T.CylinderGeometry(0.13, 0.16, 2.6, 32), alu, [0, -1.9, -0.5], undefined, undefined, fan);
    add(new T.SphereGeometry(0.24, 32, 24), pearl, [0, -0.62, -0.5], undefined, undefined, fan);
    add(new T.CylinderGeometry(1.3, 1.5, 0.22, 64), pearl, [0, -3.2, -0.5], undefined, undefined, fan);
    add(new T.TorusGeometry(1.32, 0.03, 12, 80), alu, [0, -3.09, -0.5], [Math.PI / 2, 0, 0], undefined, fan);
    const led = add(new T.SphereGeometry(0.045, 16, 12), ledMat, [0, -0.5, 0.01]);

    const rotor = new T.Group(); rotor.position.z = 0.08; head.add(rotor);
    add(new T.CylinderGeometry(0.3, 0.3, 0.25, 40), alu, [0, 0, 0], [Math.PI / 2, 0, 0], undefined, rotor);
    add(new T.SphereGeometry(0.27, 32, 24), dark, [0, 0, 0.14], undefined, [1, 1, 0.6], rotor);
    const s = new T.Shape();
    s.moveTo(0.25, -0.1); s.bezierCurveTo(0.7, -0.28, 1.25, -0.42, 1.55, -0.22);
    s.bezierCurveTo(1.72, -0.08, 1.72, 0.14, 1.5, 0.24); s.bezierCurveTo(1.1, 0.3, 0.6, 0.22, 0.25, 0.1); s.closePath();
    const bg = new T.ExtrudeGeometry(s, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
    for (let i = 0; i < 5; i++) {
      const g = new T.Group(); g.rotation.z = (i * Math.PI * 2) / 5;
      const b = new T.Mesh(bg, bladeMat); b.rotation.x = 0.38; g.add(b); rotor.add(g);
    }
    const disc = add(new T.CircleGeometry(1.62, 64), new T.MeshBasicMaterial({ color: 0xffd9a8, transparent: true, opacity: 0, depthWrite: false }), [0, 0, 0.1]);

    // protective cage
    [1.85, 1.35, 0.85, 0.42].forEach((r, i) => add(new T.TorusGeometry(r, i ? 0.014 : 0.04, 10, 96), alu, [0, 0, 0.38 + i * 0.03]));
    add(new T.TorusGeometry(1.85, 0.04, 10, 96), alu, [0, 0, -0.12]);
    add(new T.CylinderGeometry(1.85, 1.85, 0.5, 64, 1, true), M(0xcbd5e1, 0.4, 0.4, { transparent: true, opacity: 0.07, side: T.DoubleSide }), [0, 0, 0.13], [Math.PI / 2, 0, 0]);
    for (let i = 0; i < 24; i++) {
      const g = new T.Group(); g.rotation.z = (i * Math.PI * 2) / 24; g.position.z = 0.41; head.add(g);
      add(new T.CylinderGeometry(0.01, 0.01, 1.85, 6), alu, [0.925, 0, 0], [0, 0, Math.PI / 2], undefined, g);
    }

    const ptr = { x: 0, y: 0 };
    const onMove = (e: PointerEvent) => {
      const r = el.getBoundingClientRect();
      ptr.x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1));
      ptr.y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1));
    };
    window.addEventListener("pointermove", onMove);
    const resize = () => {
      const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h); const a = w / h; camera.aspect = a;
      camera.position.set(0, 0.5, a < 1 ? (13 / a) * 0.95 : 13); camera.lookAt(0, -0.1, 0); camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(resize); ro.observe(el); resize();

    let omega = 0, t = 0, sway = 0, last = performance.now(), raf = 0;
    const loop = (now: number) => {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const { on: o, speed: sp } = st.current;
      const target = o ? (sp / 100) * 18 : 0;
      omega += (target - omega) * (1 - Math.exp(-(target > omega ? 2.4 : 0.65) * dt));
      if (!o && omega < 0.01) omega = 0;
      rotor.rotation.z -= omega * dt;
      disc.material.opacity = Math.min(0.26, (omega / 18) * 0.3);
      t += dt * 0.6; sway += ((o ? 0.3 : 0) - sway) * (1 - Math.exp(-2 * dt));
      head.rotation.y += (Math.sin(t) * sway + ptr.x * 0.28 - head.rotation.y) * 0.08;
      head.rotation.x += (ptr.y * 0.1 - head.rotation.x) * 0.08;
      ledMat.color.setHex(o ? 0x22c55e : 0x475569); ledMat.emissive.setHex(o ? 0x16a34a : 0x000000);
      cyan.intensity = 0.9 + (omega / 18) * 1.4;
      renderer.render(scene, camera);
    };
    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener("pointermove", onMove);
      scene.traverse((o: any) => { if (o.geometry) o.geometry.dispose(); });
      renderer.dispose(); if (renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
    };
  }, []);

  return <div ref={mount} className="w-full h-full" role="img" aria-label="3D electric fan" />;
}

const KIND_STYLE: Record<Kind, { c: string; i: string }> = {
  on: { c: "#22c55e", i: "check" }, off: { c: "#94a3b8", i: "power" },
  speed: { c: "var(--accent)", i: "gauge" }, reset: { c: "#f59e0b", i: "reset" },
};

function Toast({ t, done }: { t: ToastItem; done: (id: number) => void }) {
  const [leave, setLeave] = useState(false);
  useEffect(() => {
    const a = setTimeout(() => setLeave(true), 2800), b = setTimeout(() => done(t.id), 3200);
    return () => { clearTimeout(a); clearTimeout(b); };
  }, []);
  const k = KIND_STYLE[t.kind];
  return (
    <div className={"toast glass flex items-center gap-3 px-4 py-3 " + (leave ? "leave" : "")} style={{ borderRadius: 18, minWidth: 250 }} role="status">
      <span style={{ color: k.c }}><Icon n={k.i} s={22} /></span>
      <span className="text-sm font-semibold">{t.msg}</span>
    </div>
  );
}

function Stat({ icon, label, value, sub }: { icon: string; label: string; value: string; sub?: string }) {
  return (
    <div className="glass p-4 sm:p-5" style={{ borderRadius: 22 }}>
      <div className="flex items-center gap-2 muted text-xs font-semibold uppercase tracking-wider"><Icon n={icon} s={16} />{label}</div>
      <div className="mt-2 text-2xl font-bold tabular-nums">{value}</div>
      {sub && <div className="muted text-xs mt-1">{sub}</div>}
    </div>
  );
}

function App() {
  const init = useRef(load()).current;
  const [on, setOn] = useState<boolean>(init.on);
  const [speed, setSpeed] = useState<number>(init.speed);
  const [theme, setTheme] = useState<Theme>(init.theme);
  const [session, setSession] = useState(0);
  const [total, setTotal] = useState<number>(init.total);
  const [energy, setEnergy] = useState<number>(init.energy);
  const [toasts, setToasts] = useState<ToastItem[]>([]);
  const idRef = useRef(0);
  const live = useRef({ on, speed }); live.current = { on, speed };
  const deb = useRef<any>(null);

  const push = (key: string, msg: string, kind: Kind) =>
    setToasts((l) => [...l.filter((x) => x.key !== key).slice(-3), { id: ++idRef.current, key, msg, kind }]);
  const drop = (id: number) => setToasts((l) => l.filter((x) => x.id !== id));

  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify({ on, speed, theme, total: Math.floor(total), energy })); } catch (e) {}
  }, [on, speed, theme, Math.floor(total)]);

  useEffect(() => {
    if (!on) return;
    setSession(0);
    let last = Date.now();
    const iv = setInterval(() => {
      const now = Date.now(), d = (now - last) / 1000; last = now;
      setSession((x) => x + d); setTotal((x) => x + d);
      setEnergy((x) => x + (watts(true, live.current.speed) * d) / 3600);
    }, 250);
    return () => clearInterval(iv);
  }, [on]);

  const toggle = () => {
    const n = !on; setOn(n);
    push("power", n ? "Fan turned ON successfully!" : "Fan turned OFF successfully!", n ? "on" : "off");
  };
  const setSpd = (v: number, immediate: boolean) => {
    setSpeed(v);
    clearTimeout(deb.current);
    const go = () => push("speed", "Fan speed updated to " + v + "%", "speed");
    if (immediate) go(); else deb.current = setTimeout(go, 450);
  };
  const reset = () => {
    clearTimeout(deb.current);
    setOn(false); setSpeed(50); setTheme("dark"); setSession(0); setTotal(0); setEnergy(0);
    push("reset", "Settings restored to defaults", "reset");
  };

  const lvl = LEVELS.find((l) => l.v === speed);
  const w = watts(on, speed);

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
      <header className="flex items-center justify-between rise">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-2xl grid place-items-center text-white" style={{ background: "var(--accent)", color: "var(--on-accent)" }}><Icon n="wind" s={22} /></div>
          <div>
            <div className="font-extrabold text-lg leading-tight tracking-tight">Aero<span className="grad">Smart</span></div>
            <div className="muted text-xs">Living Room · Smart Fan</div>
          </div>
        </div>
        <div className="flex items-center gap-1.5 sm:gap-2">
          {SOCIALS.map((s) => (
            <a key={s.n} className="btn" style={{ padding: 9 }} href={s.href} target="_blank" rel="noopener noreferrer" aria-label={s.label} title={s.label}><Icon n={s.n} s={18} /></a>
          ))}
          <button className="btn" style={{ padding: 9 }} onClick={() => setTheme(theme === "dark" ? "light" : "dark")} aria-label="Toggle theme" title="Toggle theme">
          <Icon n={theme === "dark" ? "sun" : "moon"} s={18} />
        </button>
        </div>
      </header>

      <main className="grid lg:grid-cols-5 gap-5 mt-6">
        <section className="glass lg:col-span-3 relative overflow-hidden rise" style={{ animationDelay: ".08s" }}>
          <div className="absolute inset-0 pointer-events-none transition-opacity duration-700" style={{ opacity: on ? 1 : 0, background: "radial-gradient(closest-side at 50% 40%,var(--blob1),transparent 75%)" }} />
          <div className="absolute top-5 left-5 right-5 flex items-start justify-between z-10">
            <div className="flex items-center gap-2 px-3 py-2 rounded-lg text-xs sm:text-sm font-bold tracking-wide" style={{ background: "rgba(120,130,160,.16)", border: "1px solid var(--border)" }}>
              <span className={"dot " + (on ? "run" : "")} aria-hidden="true" style={{ width: 8, height: 8, borderRadius: "50%", background: on ? "#22c55e" : "#94a3b8" }} />
              <span>{on ? "FAN IS RUNNING" : "FAN IS OFF"}</span>
            </div>
            <div className="text-right">
              <div className="text-4xl sm:text-5xl font-extrabold tabular-nums leading-none grad">{on ? speed : 0}<span className="text-xl">%</span></div>
              <div className="muted text-xs mt-1 font-medium">{on ? (lvl ? "Level " + lvl.n + " · " + lvl.label : "Custom speed") : "Standby"}</div>
            </div>
          </div>
          <div className="h-[420px] sm:h-[520px] lg:h-[600px]"><Fan3D on={on} speed={speed} /></div>
          <div className="absolute bottom-6 left-0 right-0 flex flex-col items-center gap-2 z-10">
            <button className={"switch " + (on ? "on" : "")} role="switch" aria-checked={on} aria-label="Fan power" onClick={toggle}>
              <span className="knob"><Icon n="power" s={22} /></span>
            </button>
            <span className="muted text-xs font-semibold tracking-widest uppercase">{on ? "Tap to turn off" : "Tap to turn on"}</span>
          </div>
        </section>

        <div className="lg:col-span-2 flex flex-col gap-5">
          <section className="glass p-5 sm:p-6 rise" style={{ animationDelay: ".16s" }}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-bold text-lg">Fan speed</h2>
              <span className="muted text-sm tabular-nums font-semibold">{speed}%</span>
            </div>
            <div className="grid grid-cols-4 gap-2 sm:gap-3">
              {LEVELS.map((l) => (
                <button key={l.n} className={"preset " + (speed === l.v ? "act" : "")} onClick={() => setSpd(l.v, true)} aria-pressed={speed === l.v}>
                  <div className="text-xl font-extrabold">{l.n}</div>
                  <div className="text-[11px] sm:text-xs font-semibold opacity-90">{l.label}</div>
                </button>
              ))}
            </div>
            <div className="mt-6">
              <input type="range" min={0} max={100} step={1} value={speed} aria-label="Fan speed percent"
                style={{ ["--p" as any]: speed + "%" }} onChange={(e) => setSpd(Number(e.target.value), false)} />
              <div className="flex justify-between muted text-xs mt-2 font-medium"><span>0%</span><span>50%</span><span>100%</span></div>
            </div>
          </section>

          <section className="grid grid-cols-2 gap-3 sm:gap-4 rise" style={{ animationDelay: ".24s" }}>
            <Stat icon="clock" label="Running now" value={fmt(on ? session : 0)} sub={on ? "This session" : "Fan is off"} />
            <Stat icon="clock" label="Total time" value={fmt(total)} sub="All-time operation" />
            <Stat icon="zap" label="Power draw" value={w.toFixed(1) + " W"} sub="Simulated estimate" />
            <Stat icon="battery" label="Energy used" value={energy.toFixed(2) + " Wh"} sub="Simulated estimate" />
          </section>

          <div className="flex items-center justify-between gap-3 rise" style={{ animationDelay: ".3s" }}>
            <p className="muted text-xs leading-relaxed max-w-[60%]">Power figures are simulated for demonstration and don’t reflect a real device.</p>
            <button className="btn" onClick={reset}><Icon n="reset" s={18} />Reset</button>
          </div>
        </div>
      </main>

      <div className="fixed right-4 z-50 flex flex-col gap-3 items-end" style={{ top: "calc(env(safe-area-inset-top,0px) + 16px)" }} aria-live="polite">
        {toasts.map((t) => <Toast key={t.id} t={t} done={drop} />)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
try {
  var src = document.getElementById("app-src").textContent;
  var out = Babel.transform(src, { filename: "app.tsx", presets: [["typescript", { isTSX: true, allExtensions: true }], "react"] }).code;
  (0, eval)(out);
} catch (e) {
  document.getElementById("root").innerHTML = '<p style="padding:24px;font-family:sans-serif">Could not start the dashboard: ' + String(e.message || e) + "</p>";
}
</script>
</body>
</html>
